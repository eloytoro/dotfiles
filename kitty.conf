# Kitty configuration translated from wezterm.lua.
#
# Kitty has tabs and splits (its "windows"), so most of the wezterm
# pane/tab bindings translate cleanly. A few things have no direct
# equivalent and are noted inline.
#
# Symlink to ~/.config/kitty/kitty.conf to use.

# ============================================================
# Fonts — wezterm: Monaspace Neon NF Medium @ 16
# ============================================================
font_family      Monaspace Neon Medium
bold_font        Monaspace Neon Bold
italic_font      Monaspace Neon Medium Italic
bold_italic_font Monaspace Neon Bold Italic
font_size        16.0

# ============================================================
# Window
# ============================================================
window_padding_width 0
hide_window_decorations no
macos_option_as_alt yes
macos_colorspace srgb
macos_traditional_fullscreen yes

# Let zshrc's _set_tab_title own the title (cwd basename); without this,
# kitty shell integration overwrites it with the current command name.
shell_integration no-title

# wezterm: inactive_pane_hsb { saturation = 0.9, brightness = 0.3 }
inactive_text_alpha 0.35

# splits layout = h/v splits like wezterm panes; stack = ALT+z zoom toggle.
enabled_layouts splits,stack

scrollback_lines 10000
mouse_hide_wait 1.0

# ============================================================
# Tabs
# ============================================================
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Active = bright orange bg, dark orange fg. Inactive = muted/darker.
# Match tokyonight.nvim's TabLine / TabLineSel / TabLineFill highlights.
active_tab_background    #7aa2f7
active_tab_foreground    #15161e
active_tab_font_style    bold
inactive_tab_background  #16161e
inactive_tab_foreground  #3b4261
inactive_tab_font_style  normal
tab_bar_background       #15161e

# ============================================================
# Keybindings — modeled on wezterm.lua
# ============================================================
clear_all_shortcuts no

# All kitty bindings use ALT (macos_option_as_alt keeps option as a real alt),
# so these combos are consumed by kitty and never reach tmux/other TUIs.

# --- Splits ---------------------------------------------------------
map alt+minus      launch --location=hsplit --cwd=current
map alt+\          launch --location=vsplit --cwd=current

# --- Pane navigation (ALT+ h/j/k/l) ---------------------------------
map alt+h          neighboring_window left
map alt+l          neighboring_window right
map alt+k          neighboring_window up
map alt+j          neighboring_window down

# --- Resize panes (ALT+SHIFT+h/j/k/l) -------------------------------
map alt+shift+h    resize_window narrower 5
map alt+shift+l    resize_window wider 5
map alt+shift+k    resize_window taller 1
map alt+shift+j    resize_window shorter 1

# --- Tabs -----------------------------------------------------------
map alt+t          new_tab_with_cwd
map alt+shift+t    detach_window new-tab
map alt+]          next_tab
map alt+[          previous_tab

# --- Fullscreen / layout --------------------------------------------
map alt+enter      toggle_fullscreen
map alt+r          layout_action rotate
map alt+z          toggle_layout stack

# --- Scrolling (ALT+SHIFT) ------------------------------------------
map alt+shift+b    scroll_half_page_up
map alt+shift+f    scroll_half_page_down
map alt+shift+up   scroll_line_up
map alt+shift+down scroll_line_down
map alt+shift+g    scroll_end
